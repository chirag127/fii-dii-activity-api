name: deploy

# Static GitHub Pages deploy — builds dist/ from data/ + openapi.yaml.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "data/**"
      - "openapi.yaml"
      - "src/fii_dii/build_site.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Build static site
        run: fii-dii-build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
