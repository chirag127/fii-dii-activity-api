name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build
        run: |
          mkdir -p _site
          cp -r api _site/
          cp -r schemas _site/
          cp website/index.html _site/
          cp openapi.yaml _site/
          cp README.md _site/ 2>/dev/null || true  # README.md
          cp LICENSE _site/ 2>/dev/null || true  # LICENSE
          cp SECURITY.md _site/ 2>/dev/null || true  # SECURITY.md
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
        id: deployment
      - run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"
